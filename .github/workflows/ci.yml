# R18: testes do backend + compilação dos dois firmwares a cada push e pull request
name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -v

  firmware:
    name: Firmware (${{ matrix.sketch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sketch: [sonda, controlador]
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Instala o core ESP32 e as bibliotecas
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          # versão fixa = mesma do PlatformIO (pioarduino 54.03.21 = core 3.2.1). O core 4.x removeu mbedtls/sha256.h
          arduino-cli core install esp32:esp32@3.2.1
          arduino-cli lib install PubSubClient ArduinoJson OneWire DallasTemperature "Adafruit SSD1306" "Adafruit GFX Library"
      - name: secrets.h de exemplo (o real não vai para o Git)
        run: cp firmware/${{ matrix.sketch }}/secrets.example.h firmware/${{ matrix.sketch }}/secrets.h
      - name: Compila
        run: arduino-cli compile --fqbn esp32:esp32:esp32 --warnings default --output-dir build/${{ matrix.sketch }} firmware/${{ matrix.sketch }}
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.sketch }}
          path: build/${{ matrix.sketch }}/*.bin
