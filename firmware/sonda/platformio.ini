; PlatformIO (VS Code) — firmware da Sonda (sonda-01)
; Abra a pasta firmware/sonda no VS Code com a extensão PlatformIO.
; A Arduino IDE ignora este arquivo e continua funcionando como antes.

[platformio]
; sonda.ino e secrets.h ficam nesta mesma pasta
src_dir = .

[env:sonda]
; pioarduino 54.03.21 = core Arduino-ESP32 3.2.1 (versão fixa: a "stable" exige PlatformIO Core >= 6.2.0)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21/platform-espressif32.zip
; esp32dev = "ESP32 Dev Module" da Arduino IDE
board = esp32dev
framework = arduino
; compila só o firmware desta pasta (não a pasta .pio com as bibliotecas baixadas)
build_src_filter = +<*> -<.pio/> -<.vscode/>
; tabela padrão: duas partições de app, necessárias para a OTA
board_build.partitions = default.csv
monitor_speed = 115200
; porta USB desta placa (Gerenciador de Dispositivos → Portas COM). Evita gravar na placa errada
upload_port = COM7
monitor_port = COM7
; log2file: salva a saída do Serial Monitor em platformio-device-monitor-*.log nesta pasta
monitor_filters = esp32_exception_decoder, time, log2file
lib_deps =
  knolleary/PubSubClient
  bblanchon/ArduinoJson@^7
  paulstoffregen/OneWire
  milesburton/DallasTemperature
  adafruit/Adafruit SSD1306
  adafruit/Adafruit GFX Library
